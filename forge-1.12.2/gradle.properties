# 1.12.2 的 ForgeGradle 3 + Gradle 4.9 只能在 Java 8 下运行，显式锁定 JDK，避免用到 G:\java17/java21。
org.gradle.java.home=G:/java8
# 反编译 Minecraft 需要足够内存。
# 反编译与编译都需要内存；强制英文输出，否则 javac 报错在中文控制台下是乱码。
org.gradle.jvmargs=-Xmx3G -Duser.language=en -Duser.country=US
org.gradle.daemon=false

minecraft_version=1.12.2
forge_version=14.23.5.2860

mod_id=veinminerplus
mod_name=VeinMinerPlus
mod_license=MIT
mod_version=4.2.2-forge-1.12.2
mod_group_id=com.extrarawstyle.veinminerplus
mod_authors=Extra_RawStyle
mod_description=Server-authoritative chain mining for Minecraft 1.12.2 Forge.
