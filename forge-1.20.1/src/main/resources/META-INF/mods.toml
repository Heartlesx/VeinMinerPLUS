modLoader="javafml"
loaderVersion="[47,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# The removal observation: reads what vanilla's own removal call returned for each chained block.
# This must sit right after [[mods]] and before the dependency tables; Forge parses the file in
# order and a [[mixins]] block after [[dependencies]] is silently dropped.
[[mixins]]
config="veinminerplus.mixins.json"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="[${forge_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="[${minecraft_version},1.21)"
ordering="NONE"
side="BOTH"
