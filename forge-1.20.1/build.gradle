plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    // LineStateShard is protected; the preview needs it to ask for a one-pixel line width, the
    // same way vanilla's own LINES type asks for the window-scaled one.
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                veinminerplus {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.console.level', 'debug'
            mods {
                veinminerplus {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // API-only jars, used at compile time and never shipped: the mod still loads without them.
    compileOnly fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}:api")
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")

    // Optional compatibility targets. These are compile-time only: the patches are written against
    // the exact versions below, stay inert when those mods are absent or differ, and nothing of them
    // ships. libs/compat/README.md says which jars to put there.
    compileOnly files("libs/compat/architectury-9.2.14-forge.jar")
    compileOnly files("libs/compat/Delightful-1.20.1-3.7.6.jar")
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            forge_version: forge_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title': mod_id,
                'Specification-Vendor': mod_authors,
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor': mod_authors,
                // Forge reads mixin configs from this manifest attribute. NeoForge also accepts a
                // [[mixins]] block in the mod metadata, which mods.toml carries, but Forge 1.20.1
                // does not, so both are declared and either loader picks the config up.
                'MixinConfigs': 'veinminerplus.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
